# ============================================================
# VENTANA DE AYUDA
# ============================================================
# Define el título, el encabezado y las instrucciones para
# utilizar las funciones principales de la aplicación.
#
# Los caracteres \n separan líneas y párrafos. Deben conservarse
# para que el texto aparezca correctamente estructurado.

help.title=Hogwarths laguntza
help.header=Aplikazioa erabiltzeko argibideak
help.body=BILATU ETA KONTSULTATU\nIdatzi izen bat bilatzailean ikasleak bilatzeko. Erabili etxearen hautatzailea emaitzak iragazteko. Hautatu errenkada bat ikaslearen fitxa ikusteko.\n\nGEHITU, EDITATU ETA EZABATU\n«Ikaslea gehitu» aukerak Hogwarthseko ikasle berria sortzen du. «Ikaslea editatu» eta «Ikaslea ezabatu» aukerak etxe horretako ikasle berrientzat bakarrik daude erabilgarri. Ikasle historikoak irakurtzeko soilik dira.\n\nHIZKUNTZAK\nAukeratu Euskara, Castellano edo English goiko eskuineko aldean. Interfazea eta taulako nahiz fitxako balio ezagunak itzultzen dira. Datu-baseetako jatorrizko datuak ez dira aldatzen; itzulpenik gabeko balioak bere horretan agertzen dira.\n\nLASTER-TEKLAK\nCtrl+F  Ikaslea bilatu\nCtrl+N  Ikaslea gehitu\nCtrl+E  Hautatutako ikaslea editatu (Hogwarths bakarrik)\nEzabatu  Hautatutako ikaslea ezabatu (taula fokuratuta)\nCtrl+R  Emaitzak eguneratu\nCtrl+L  Hizkuntza-hautatzailea ireki\nF1         Laguntza hau ireki\nTab      Kontrolen artean mugitu\nEsc      Leihoak itxi edo bertan behera utzi\n\nIRISGARRITASUNA\nFokua duen kontrola nabarmenduta dago. Taulan gezi-teklak erabil ditzakezu.


