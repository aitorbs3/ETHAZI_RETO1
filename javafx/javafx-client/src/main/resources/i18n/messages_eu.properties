about.body=Bertsioa: {0}\nEgileak: {1}\n\nETHAZI proiektuko JavaFX bezeroa.\nIkasle historikoen kontsulta eta Hogwarthseko ikasle berrien kudeaketa FastAPI bidez.\n\nLaguntza: sakatu F1.
