help.title=Hogwarths help
help.header=How to use the application
help.body=SEARCH AND VIEW\nEnter a name to find students. Use the house selector to filter the results. Select a row to view its student profile.\n\nADD, EDIT AND DELETE\n“Add student” creates a new Hogwarths student. “Edit student” and “Delete student” are only available for new students in that house. Historical students are read-only.\n\nLANGUAGES\nSelect Euskara, Castellano or English in the upper-right corner. The interface and known values in the table and student profile are translated. Original database values remain unchanged; unknown values are shown as received.\n\nKEYBOARD SHORTCUTS\nCtrl+F  Find a student\nCtrl+N  Add a student\nCtrl+E  Edit selected student (Hogwarths only)\nDelete  Delete selected student (when table is focused)\nCtrl+R  Refresh results\nCtrl+L  Open language selector\nF1         Open this help\nTab      Move between controls\nEsc      Close or cancel dialogs\n\nACCESSIBILITY\nThe focused control is highlighted. Use arrow keys to navigate the student table.
about.title=About Hogwarths
