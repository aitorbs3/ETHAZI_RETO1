# ============================================================
# ARCHIVO DE RECURSOS DE LA INTERFAZ EN INGLÉS
# ============================================================
# Este archivo centraliza los textos que se muestran en la
# aplicación JavaFX cuando el idioma seleccionado es el inglés.
#
# Se utiliza el formato Java Properties:
# clave=valor
#
# Las claves permiten separar los textos de la interfaz del código
# Java, facilitando su mantenimiento y traducción a otros idiomas.
#
# Los marcadores como {0} se sustituyen por valores dinámicos
# desde el código Java. No deben eliminarse ni modificarse.
#
# Los caracteres \n representan saltos de línea dentro de un texto.


