# ============================================================
# ARCHIVO DE TRADUCCIONES AL ESPAÑOL PARA LA VISUALIZACIÓN
# ============================================================
# Este archivo contiene las traducciones al español de determinados
# valores que se muestran en la interfaz gráfica de la aplicación.
#
# Las traducciones se utilizan exclusivamente para la visualización:
# los datos almacenados en las bases de datos y los valores enviados
# o recibidos mediante peticiones HTTP no se modifican.
#
# Formato de las entradas:
# categoria.clave=Texto traducido
#
# Las claves se generan en minúsculas, sin tildes y utilizando
# guiones bajos como separadores cuando es necesario.
#
# Si falta una clave de traducción, JavaFX puede mostrar el valor
# original, según el comportamiento implementado en la aplicación.


