help.title=Ayuda de Hogwarths
help.header=Cómo utilizar la aplicación
help.body=BUSCAR Y CONSULTAR\nEscribe un nombre en el buscador para filtrar alumnos. Utiliza el selector de casa para limitar los resultados. Selecciona una fila para ver la ficha.\n\nAÑADIR, EDITAR Y ELIMINAR\n«Añadir alumno» crea un alumno nuevo de Hogwarths. «Editar alumno» y «Eliminar alumno» solo están disponibles al seleccionar alumnos nuevos de esa casa. Los alumnos históricos son de solo lectura.\n\nIDIOMAS\nElige Euskara, Castellano o English en la parte superior derecha. Se traducen la interfaz y los valores conocidos de la tabla y la ficha. Los datos originales de las bases no cambian; los valores sin traducción se muestran tal cual.\n\nATAJOS DE TECLADO\nCtrl+F  Buscar alumno\nCtrl+N  Añadir alumno\nCtrl+E  Editar alumno seleccionado (solo Hogwarths)\nSupr    Eliminar alumno seleccionado (con la tabla enfocada)\nCtrl+R  Actualizar resultados\nCtrl+L  Abrir selector de idioma\nF1         Abrir esta ayuda\nTab      Moverse entre controles\nEsc      Cerrar o cancelar diálogos\n\nACCESIBILIDAD\nEl control enfocado se resalta. Puedes moverte por la tabla usando las teclas de dirección.
about.title=Acerca de Hogwarths
about.heading=Hogwarths · Gestión de alumnos
about.body=Versión: {0}\nAutores: {1}\n\nCliente JavaFX del proyecto ETHAZI.\nConsulta de alumnos históricos y gestión de alumnos nuevos de Hogwarths mediante FastAPI.\n\nAyuda: pulsa F1.
