services:

  # ==========================================
  # BACKEND - FASTAPI
  # ==========================================

  backend-api:
    build: ./backend
    container_name: reto01-backend

    ports:
      - "8000:8000"

    environment:

      # SQLite: misma base de datos que Windows
      ETHAZI_SQL_DIR: /app/data/sql
      SQLITE_DATABASE: /app/data/databases/sqlite_reto.db
      DERBY_DATABASE: /app/data/databases/derby/gryffindor
      H2_DATABASE: /app/data/databases/h2/hufflepuff/hufflepuff
      HSQLDB_DATABASE: /app/data/databases/hsqldb/slytherin

      # MariaDB
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

      # Oracle
      ORACLE_HOST: oracle
      ORACLE_PORT: "1521"
      ORACLE_SERVICE_NAME: ${ORACLE_SERVICE_NAME:-FREEPDB1}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}

    volumes:
      # Acceso a las bases de datos del proyecto
      - ./data:/app/data

    depends_on:
      oracle:
        condition: service_healthy

      mariadb:
        condition: service_healthy

    # Reinicio automático
    restart: unless-stopped

  # ==========================================
  # ORACLE - RAVENCLAW
  # ==========================================

  oracle:
    image: gvenzl/oracle-free:latest
    container_name: reto01-oracle

    ports:
      - "1521:1521"

    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD}
      APP_USER: ${ORACLE_USER}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD}

    volumes:
      - oracle_data:/opt/oracle/oradata

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  # ==========================================
  # MARIADB - HOGWARTHS
  # ==========================================

  mariadb:
    image: mariadb:11.8
    container_name: reto01-mariadb

    ports:
      - "3306:3306"

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

# ==========================================
# VOLÚMENES PERSISTENTES
# ==========================================

volumes:
  oracle_data:
  mariadb_data:
