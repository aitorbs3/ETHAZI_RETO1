services:
  oracle:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: reto01-oracle

    ports:
      - "1521:1521"

    environment:
      ORACLE_PWD: ${ORACLE_ADMIN_PASSWORD}

    volumes:
      - oracle_data:/opt/oracle/oradata

    restart: unless-stopped

volumes:
  oracle_data: